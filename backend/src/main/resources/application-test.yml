spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: jdbc:tc:postgresql:15.3:///thrift_auction_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

server:
  port: 0

app:
  cache:
    redis-enabled: false
  admin:
    email: admin@test.com
    password: test
    allowed-ips: 127.0.0.1
  staff:
    email: staff@test.com
    password: test
  security:
    browser:
      allowed-origins: http://localhost:3000
      session-cookie-name: THRIFTLY_SESSION
      secure-cookie: false
      same-site: Lax
      trusted-proxies: 127.0.0.1
      absolute-timeout: 12h

google:
  client:
    id: test-client

payos:
  client-id: test
  api-key: test
  checksum-key: test

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

ai:
  openai:
    api-key: test
    url: http://localhost:8080
    model: test

ghn:
  token: test
  shop-id: 123
  webhook-secret: test-webhook-secret
  order-creation-enabled: false
  default-shipping-fee: 35000
  api:
    url: http://localhost:8080

FRONTEND_URL: http://localhost:3000
