spring:
  application:
    name: ThriftAuction
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ThriftlyHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    baseline-on-migrate: true
  session:
    store-type: redis
    timeout: ${SESSION_IDLE_TIMEOUT:30m}
    redis:
      namespace: ${SESSION_REDIS_NAMESPACE:thriftly:session}
      repository-type: indexed
      flush-mode: on-save
      save-mode: on-set-attribute
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  forward-headers-strategy: framework
  shutdown: graceful

app:
  security:
    browser:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      session-cookie-name: ${SESSION_COOKIE_NAME:THRIFTLY_SESSION}
      secure-cookie: ${SESSION_COOKIE_SECURE:false}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
      cookie-domain: ${SESSION_COOKIE_DOMAIN:}
      absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}

payos:
  return-url: ${FRONTEND_URL}/payment/payos-return
  cancel-url: ${FRONTEND_URL}/payment/payos-return?cancel=true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,diskSpace
  metrics:
    tags:
      application: ${spring.application.name}
